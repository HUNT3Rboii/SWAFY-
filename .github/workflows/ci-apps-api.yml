name: CI apps-api

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/contracts/enums.md'
      - '.github/workflows/ci-apps-api.yml'
  push:
    paths:
      - 'apps/api/**'
      - 'docs/contracts/enums.md'
      - '.github/workflows/ci-apps-api.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: swafy_test
          POSTGRES_USER: swafy
          POSTGRES_PASSWORD: swafy-dev-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swafy -d swafy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://swafy:swafy-dev-password@localhost:5432/swafy_test
      TEST_DATABASE_URL: postgresql+psycopg://swafy:swafy-dev-password@localhost:5432/swafy_test
      JWT_SECRET: test-secret-at-least-32-characters-long
      WORKER_SERVICE_TOKEN: test-worker-token-at-least-32-chars
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Test
        run: pytest
      - name: Build API image
        run: docker build -t swafy-api:ci .
