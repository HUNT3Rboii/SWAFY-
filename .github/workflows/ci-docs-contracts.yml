name: CI docs/contracts

on:
  pull_request:
    paths:
      - 'docs/contracts/**'
      - '.github/workflows/ci-docs-contracts.yml'
  push:
    paths:
      - 'docs/contracts/**'
      - '.github/workflows/ci-docs-contracts.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint OpenAPI contract
        run: npx --yes @redocly/cli@1.34.5 lint docs/contracts/openapi.yaml
