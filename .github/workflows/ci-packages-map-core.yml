name: CI packages/map-core

on:
  pull_request:
    paths:
      - 'packages/map-core/**'
      - '.github/workflows/ci-packages-map-core.yml'
  push:
    paths:
      - 'packages/map-core/**'
      - '.github/workflows/ci-packages-map-core.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/map-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/map-core/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
