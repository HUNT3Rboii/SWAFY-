name: CI services/vision-worker

on:
  pull_request:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/ci-services-vision-worker.yml'
  push:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/ci-services-vision-worker.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Worker present?
        id: check
        run: |
          if [ -f requirements-dev.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::services/vision-worker has no code yet, skipping tests"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/vision-worker/requirements-dev.txt

      - name: Install
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements-dev.txt

      - name: Test
        if: steps.check.outputs.run == 'true'
        run: pytest

      - name: Docker image builds
        if: steps.check.outputs.run == 'true'
        run: docker build -t vision-worker-ci .
